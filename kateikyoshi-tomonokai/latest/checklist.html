<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>オンライン東大家庭教師友の会 問い合わせ・面談チェックリスト</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Noto Sans JP', 'Hiragino Sans', 'Meiryo', sans-serif;
  font-size: 14px;
  line-height: 1.7;
  color: #1f2937;
  background: #f9fafb;
  padding: 20px;
  max-width: 720px;
  margin: 0 auto;
}
.header {
  background: linear-gradient(135deg, #1d4ed8, #3b82f6);
  color: #fff;
  padding: 20px 24px;
  border-radius: 10px;
  margin-bottom: 20px;
}
.header h1 { font-size: 1.25rem; font-weight: bold; margin-bottom: 4px; }
.header .meta { font-size: .8rem; opacity: .85; }
.section-title {
  font-size: .8rem;
  font-weight: bold;
  color: #6b7280;
  text-transform: uppercase;
  letter-spacing: .05em;
  margin: 20px 0 8px;
  padding-bottom: 4px;
  border-bottom: 1px solid #e5e7eb;
}
.check-item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 10px 12px;
  background: #fff;
  border: 1px solid #e5e7eb;
  border-radius: 6px;
  margin-bottom: 6px;
  cursor: pointer;
  transition: background .15s;
}
.check-item:hover { background: #f0f9ff; }
.check-box { width: 18px; height: 18px; cursor: pointer; flex-shrink: 0; margin-top: 2px; accent-color: #3b82f6; }
label { display: flex; flex-wrap: wrap; gap: 4px 8px; cursor: pointer; flex: 1; }
.check-num {
  background: #dbeafe;
  color: #1d4ed8;
  font-size: .75rem;
  font-weight: bold;
  border-radius: 3px;
  padding: 0 5px;
  white-space: nowrap;
}
.check-cat {
  font-size: .8rem;
  color: #6b7280;
  white-space: nowrap;
}
.check-text { font-size: .88rem; color: #1f2937; }
input:checked + label .check-text { text-decoration: line-through; color: #9ca3af; }
.footer {
  text-align: center;
  font-size: .75rem;
  color: #9ca3af;
  margin-top: 20px;
  padding-top: 12px;
  border-top: 1px solid #e5e7eb;
}
.print-btn {
  display: block;
  width: 100%;
  padding: 10px;
  background: #3b82f6;
  color: #fff;
  border: none;
  border-radius: 6px;
  font-size: .9rem;
  cursor: pointer;
  margin-top: 16px;
}
.print-btn:hover { background: #2563eb; }

@media print {
  body { background: #fff; padding: 0; max-width: 100%; }
  .header { background: #1d4ed8 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .check-box { -webkit-print-color-adjust: exact; }
  .print-btn { display: none; }
  .check-item { break-inside: avoid; }
}
</style>
</head>
<body>
<div class="header">
  <h1>📋 オンライン東大家庭教師友の会</h1>
  <div class="meta">問い合わせ・面談時チェックリスト｜2026年07月16日 作成</div>
</div>

<div class="section-title">確認事項（全17項目）</div>

        <div class="check-item">
          <input type="checkbox" id="chk1" class="check-box">
          <label for="chk1">
            <span class="check-num">01</span>
            <span class="check-cat">対象学年確認</span>
            <span class="check-text">対応学年・対象範囲を確認した（キャンペーン対象学年との相違に注意）</span>
          </label>
        </div>
        <div class="check-item">
          <input type="checkbox" id="chk2" class="check-box">
          <label for="chk2">
            <span class="check-num">02</span>
            <span class="check-cat">料金体系確認</span>
            <span class="check-text">料金体系（時間単価・学年別/目的別の違い）を確認した</span>
          </label>
        </div>
        <div class="check-item">
          <input type="checkbox" id="chk3" class="check-box">
          <label for="chk3">
            <span class="check-num">03</span>
            <span class="check-cat">無料体験の内容確認</span>
            <span class="check-text">無料体験授業の内容・回数・条件を確認した</span>
          </label>
        </div>
        <div class="check-item">
          <input type="checkbox" id="chk4" class="check-box">
          <label for="chk4">
            <span class="check-num">04</span>
            <span class="check-cat">教師変更条件確認</span>
            <span class="check-text">教師の変更・交代にかかる条件や費用を確認した</span>
          </label>
        </div>
        <div class="check-item">
          <input type="checkbox" id="chk5" class="check-box">
          <label for="chk5">
            <span class="check-num">05</span>
            <span class="check-cat">追加費用確認</span>
            <span class="check-text">入会金・解約金・キャンセル料等の追加費用の有無を確認した</span>
          </label>
        </div>
        <div class="check-item">
          <input type="checkbox" id="chk6" class="check-box">
          <label for="chk6">
            <span class="check-num">06</span>
            <span class="check-cat">授業形式確認</span>
            <span class="check-text">授業形式（オンライン/対面、使用ツール）を確認した</span>
          </label>
        </div>
        <div class="check-item">
          <input type="checkbox" id="chk7" class="check-box">
          <label for="chk7">
            <span class="check-num">07</span>
            <span class="check-cat">対応エリア時間帯確認</span>
            <span class="check-text">対応エリア・時間帯の制約を確認した</span>
          </label>
        </div>
        <div class="check-item">
          <input type="checkbox" id="chk8" class="check-box">
          <label for="chk8">
            <span class="check-num">08</span>
            <span class="check-cat">教材費確認</span>
            <span class="check-text">教材費・機材費が別途必要か確認した</span>
          </label>
        </div>
        <div class="check-item">
          <input type="checkbox" id="chk9" class="check-box">
          <label for="chk9">
            <span class="check-num">09</span>
            <span class="check-cat">契約期間確認</span>
            <span class="check-text">契約期間・最低利用期間の縛りを確認した</span>
          </label>
        </div>
        <div class="check-item">
          <input type="checkbox" id="chk10" class="check-box">
          <label for="chk10">
            <span class="check-num">10</span>
            <span class="check-cat">進捗報告確認</span>
            <span class="check-text">保護者向けの学習報告・進捗共有の有無を確認した</span>
          </label>
        </div>
        <div class="check-item">
          <input type="checkbox" id="chk11" class="check-box">
          <label for="chk11">
            <span class="check-num">11</span>
            <span class="check-cat">解約手続き確認</span>
            <span class="check-text">解約・退会の手続き方法を確認した</span>
          </label>
        </div>
        <div class="check-item">
          <input type="checkbox" id="chk12" class="check-box">
          <label for="chk12">
            <span class="check-num">12</span>
            <span class="check-cat">他社比較実施</span>
            <span class="check-text">類似サービスと料金・体験内容を比較検討した</span>
          </label>
        </div>
        <div class="check-item">
          <input type="checkbox" id="chk13" class="check-box">
          <label for="chk13">
            <span class="check-num">13</span>
            <span class="check-cat">service_name</span>
            <span class="check-text">サービス名: オンライン東大家庭教師友の会（運営: 株式会社トモノカイ、創業26年）を確認した</span>
          </label>
        </div>
        <div class="check-item">
          <input type="checkbox" id="chk14" class="check-box">
          <label for="chk14">
            <span class="check-num">14</span>
            <span class="check-cat">pricing_base</span>
            <span class="check-text">料金: 小中高生の家庭教師 3,960円/時間〜（学年別・目的別に細分化）を確認した</span>
          </label>
        </div>
        <div class="check-item">
          <input type="checkbox" id="chk15" class="check-box">
          <label for="chk15">
            <span class="check-num">15</span>
            <span class="check-cat">seven_zero_yen</span>
            <span class="check-text">「7つの0円」制度: 体験料・教師交代費・キャンセル料・更新費・解約費・兄弟姉妹入会費・機材貸出費が全て0円を確認した</span>
          </label>
        </div>
        <div class="check-item">
          <input type="checkbox" id="chk16" class="check-box">
          <label for="chk16">
            <span class="check-num">16</span>
            <span class="check-cat">trial_lesson</span>
            <span class="check-text">70分無料体験授業＋オンライン自習室無料体験（7月キャンペーン、内容は月替わりの可能性あり）を確認した</span>
          </label>
        </div>
        <div class="check-item">
          <input type="checkbox" id="chk17" class="check-box">
          <label for="chk17">
            <span class="check-num">17</span>
            <span class="check-cat">coverage_area</span>
            <span class="check-text">対応エリア: 全国（オンライン指導のため教師の対応エリアを気にせず選択可能）を確認した</span>
          </label>
        </div>

<button class="print-btn" onclick="window.print()">🖨️ 印刷 / PDFで保存</button>

<div class="footer">
  このチェックリストは オンライン東大家庭教師友の会 の申込み前確認用です。
  情報は 2026年07月16日 時点のものです。最新情報は公式サイトでご確認ください。
</div>
</body>
</html>
