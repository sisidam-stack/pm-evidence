<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ベビーパーク 〈教室に通う方向け〉無料体験・申し込み前チェックリスト</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Noto Sans JP', 'Hiragino Sans', 'Meiryo', sans-serif;
  font-size: 14px;
  line-height: 1.7;
  color: #1f2937;
  background: #f9fafb;
  padding: 20px;
  max-width: 720px;
  margin: 0 auto;
}
.header {
  background: linear-gradient(135deg, #1d4ed8, #3b82f6);
  color: #fff;
  padding: 20px 24px;
  border-radius: 10px;
  margin-bottom: 20px;
}
.header h1 { font-size: 1.25rem; font-weight: bold; margin-bottom: 4px; }
.header .meta { font-size: .8rem; opacity: .85; }
.section-title {
  font-size: .8rem;
  font-weight: bold;
  color: #6b7280;
  text-transform: uppercase;
  letter-spacing: .05em;
  margin: 20px 0 8px;
  padding-bottom: 4px;
  border-bottom: 1px solid #e5e7eb;
}
.check-item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 10px 12px;
  background: #fff;
  border: 1px solid #e5e7eb;
  border-radius: 6px;
  margin-bottom: 6px;
  cursor: pointer;
  transition: background .15s;
}
.scope-note {
  background: #fffbeb;
  border: 1px solid #f59e0b;
  border-radius: 6px;
  padding: 10px 12px;
  margin-bottom: 12px;
  font-size: .85rem;
}
.check-item:hover { background: #f0f9ff; }
.check-box { width: 18px; height: 18px; cursor: pointer; flex-shrink: 0; margin-top: 2px; accent-color: #3b82f6; }
label { display: flex; flex-wrap: wrap; gap: 4px 8px; cursor: pointer; flex: 1; }
.check-num {
  background: #dbeafe;
  color: #1d4ed8;
  font-size: .75rem;
  font-weight: bold;
  border-radius: 3px;
  padding: 0 5px;
  white-space: nowrap;
}
.check-cat {
  font-size: .8rem;
  color: #6b7280;
  white-space: nowrap;
}
.check-text { font-size: .88rem; color: #1f2937; }
input:checked + label .check-text { text-decoration: line-through; color: #9ca3af; }
.footer {
  text-align: center;
  font-size: .75rem;
  color: #9ca3af;
  margin-top: 20px;
  padding-top: 12px;
  border-top: 1px solid #e5e7eb;
}
.print-btn {
  display: block;
  width: 100%;
  padding: 10px;
  background: #3b82f6;
  color: #fff;
  border: none;
  border-radius: 6px;
  font-size: .9rem;
  cursor: pointer;
  margin-top: 16px;
}
.print-btn:hover { background: #2563eb; }

@media print {
  body { background: #fff; padding: 0; max-width: 100%; }
  .header { background: #1d4ed8 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .check-box { -webkit-print-color-adjust: exact; }
  .print-btn { display: none; }
  .check-item { break-inside: avoid; }
}
</style>
</head>
<body>
<div class="header">
  <h1>📋 ベビーパーク</h1>
  <div class="meta">〈教室に通う方向け〉無料体験・申し込み前チェックリスト｜2026年10月14日 作成</div>
</div>

<div class="scope-note">この表は、ベビーパークの教室に通う場合の確認用です。別サービスの「オンライン親子教室」は申込み・支払い方法（クレジットカード決済）などが異なるため、この表はそのまま使えません。</div>
<div class="section-title">確認事項（全14項目）</div>

        <div class="check-item">
          <input type="checkbox" id="chk1" class="check-box">
          <label for="chk1">
            <span class="check-num">01</span>
            <span class="check-cat">月齢とクラス</span>
            <span class="check-text">子どもの今の月齢で入るクラスを確かめた（0歳2ヵ月〜3歳0ヵ月を月齢7ヵ月ごとに A〜E の5クラスに分けている）</span>
          </label>
        </div>
        <div class="check-item">
          <input type="checkbox" id="chk2" class="check-box">
          <label for="chk2">
            <span class="check-num">02</span>
            <span class="check-cat">通える曜日</span>
            <span class="check-text">通える教室で、通える曜日・時間帯のレッスンに空きがあるかを教室に聞いた</span>
          </label>
        </div>
        <div class="check-item">
          <input type="checkbox" id="chk3" class="check-box">
          <label for="chk3">
            <span class="check-num">03</span>
            <span class="check-cat">無料体験の流れ</span>
            <span class="check-text">無料体験は「おうち編」（オンライン約30分）に参加してから「教室編」（約50分）に進む2段階であることを確かめた</span>
          </label>
        </div>
        <div class="check-item">
          <input type="checkbox" id="chk4" class="check-box">
          <label for="chk4">
            <span class="check-num">04</span>
            <span class="check-cat">見学</span>
            <span class="check-text">教室の見学はできず、教室の様子は体験レッスンで確かめることを知った</span>
          </label>
        </div>
        <div class="check-item">
          <input type="checkbox" id="chk5" class="check-box">
          <label for="chk5">
            <span class="check-num">05</span>
            <span class="check-cat">講師の対応</span>
            <span class="check-text">体験レッスンで、講師が子どもと保護者にどう声をかけるか、質問にどう答えるかを見た</span>
          </label>
        </div>
        <div class="check-item">
          <input type="checkbox" id="chk6" class="check-box">
          <label for="chk6">
            <span class="check-num">06</span>
            <span class="check-cat">毎月の総額</span>
            <span class="check-text">毎月かかる総額（レッスン料・教材・管理費の合計）を、子どものクラスで料金ページと公式サイトから確かめた</span>
          </label>
        </div>
        <div class="check-item">
          <input type="checkbox" id="chk7" class="check-box">
          <label for="chk7">
            <span class="check-num">07</span>
            <span class="check-cat">入室金</span>
            <span class="check-text">入室金を、料金ページと公式サイトで確かめた</span>
          </label>
        </div>
        <div class="check-item">
          <input type="checkbox" id="chk8" class="check-box">
          <label for="chk8">
            <span class="check-num">08</span>
            <span class="check-cat">兄弟の同伴</span>
            <span class="check-text">レッスンに兄弟は同伴できないことを知り、通う日に兄弟をどうするかを考えた</span>
          </label>
        </div>
        <div class="check-item">
          <input type="checkbox" id="chk9" class="check-box">
          <label for="chk9">
            <span class="check-num">09</span>
            <span class="check-cat">付き添う保護者</span>
            <span class="check-text">付き添いは母親以外（父・祖父母）でもよく、2名以内なら一緒に参加できることを確かめた</span>
          </label>
        </div>
        <div class="check-item">
          <input type="checkbox" id="chk10" class="check-box">
          <label for="chk10">
            <span class="check-num">10</span>
            <span class="check-cat">振替</span>
            <span class="check-text">月1回の欠席分に限り、定員に空きがあるレッスンへ、欠席から1ヵ月以内に振替できることを確かめた</span>
          </label>
        </div>
        <div class="check-item">
          <input type="checkbox" id="chk11" class="check-box">
          <label for="chk11">
            <span class="check-num">11</span>
            <span class="check-cat">退室の締切</span>
            <span class="check-text">退室届は最終在籍月の前月20日まで（20日が日曜・祝日なら前の営業日）に教室へ出すことを確かめた</span>
          </label>
        </div>
        <div class="check-item">
          <input type="checkbox" id="chk12" class="check-box">
          <label for="chk12">
            <span class="check-num">12</span>
            <span class="check-cat">休室の締切</span>
            <span class="check-text">休室届は休室する月の前々月20日まで（20日が日曜・祝日なら前の営業日）に教室へ出し、無料で休めるのは最大3ヵ月までであることを確かめた</span>
          </label>
        </div>
        <div class="check-item">
          <input type="checkbox" id="chk13" class="check-box">
          <label for="chk13">
            <span class="check-num">13</span>
            <span class="check-cat">支払い方法</span>
            <span class="check-text">支払いは口座引落で、口座の登録が終わるまでは郵送のコンビニ振込用紙で払うことを確かめた</span>
          </label>
        </div>
        <div class="check-item">
          <input type="checkbox" id="chk14" class="check-box">
          <label for="chk14">
            <span class="check-num">14</span>
            <span class="check-cat">家での続け方</span>
            <span class="check-text">教室で教わった遊びや声かけを、家で続ける時間がとれるかを家族で話し合った</span>
          </label>
        </div>

<button class="print-btn" onclick="window.print()">🖨️ 印刷 / PDFで保存</button>

<div class="footer">
  このチェックリストは ベビーパーク の申込み前確認用です。
  情報は 2026年10月14日 時点のものです。最新情報は公式サイトでご確認ください。
</div>
</body>
</html>
