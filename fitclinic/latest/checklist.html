<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>フィットクリニック オンライン診療 申し込み前チェックリスト</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Noto Sans JP', 'Hiragino Sans', 'Meiryo', sans-serif;
  font-size: 14px;
  line-height: 1.7;
  color: #1f2937;
  background: #f9fafb;
  padding: 20px;
  max-width: 720px;
  margin: 0 auto;
}
.header {
  background: linear-gradient(135deg, #1d4ed8, #3b82f6);
  color: #fff;
  padding: 20px 24px;
  border-radius: 10px;
  margin-bottom: 20px;
}
.header h1 { font-size: 1.25rem; font-weight: bold; margin-bottom: 4px; }
.header .meta { font-size: .8rem; opacity: .85; }
.section-title {
  font-size: .8rem;
  font-weight: bold;
  color: #6b7280;
  text-transform: uppercase;
  letter-spacing: .05em;
  margin: 20px 0 8px;
  padding-bottom: 4px;
  border-bottom: 1px solid #e5e7eb;
}
.check-item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 10px 12px;
  background: #fff;
  border: 1px solid #e5e7eb;
  border-radius: 6px;
  margin-bottom: 6px;
  cursor: pointer;
  transition: background .15s;
}
.scope-note {
  background: #fffbeb;
  border: 1px solid #f59e0b;
  border-radius: 6px;
  padding: 10px 12px;
  margin-bottom: 12px;
  font-size: .85rem;
}
.check-item:hover { background: #f0f9ff; }
.check-box { width: 18px; height: 18px; cursor: pointer; flex-shrink: 0; margin-top: 2px; accent-color: #3b82f6; }
label { display: flex; flex-wrap: wrap; gap: 4px 8px; cursor: pointer; flex: 1; }
.check-num {
  background: #dbeafe;
  color: #1d4ed8;
  font-size: .75rem;
  font-weight: bold;
  border-radius: 3px;
  padding: 0 5px;
  white-space: nowrap;
}
.check-cat {
  font-size: .8rem;
  color: #6b7280;
  white-space: nowrap;
}
.check-text { font-size: .88rem; color: #1f2937; }
input:checked + label .check-text { text-decoration: line-through; color: #9ca3af; }
.footer {
  text-align: center;
  font-size: .75rem;
  color: #9ca3af;
  margin-top: 20px;
  padding-top: 12px;
  border-top: 1px solid #e5e7eb;
}
.print-btn {
  display: block;
  width: 100%;
  padding: 10px;
  background: #3b82f6;
  color: #fff;
  border: none;
  border-radius: 6px;
  font-size: .9rem;
  cursor: pointer;
  margin-top: 16px;
}
.print-btn:hover { background: #2563eb; }

@media print {
  body { background: #fff; padding: 0; max-width: 100%; }
  .header { background: #1d4ed8 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .check-box { -webkit-print-color-adjust: exact; }
  .print-btn { display: none; }
  .check-item { break-inside: avoid; }
}
</style>
</head>
<body>
<div class="header">
  <h1>📋 フィットクリニック</h1>
  <div class="meta">オンライン診療 申し込み前チェックリスト｜2026年10月24日 作成</div>
</div>

<div class="section-title">確認事項（全16項目）</div>

        <div class="check-item">
          <input type="checkbox" id="chk1" class="check-box">
          <label for="chk1">
            <span class="check-num">01</span>
            <span class="check-cat">オンライン診療</span>
            <span class="check-text">初診からオンライン診療を受けられ、医師の問診は電話で行われることを確かめた</span>
          </label>
        </div>
        <div class="check-item">
          <input type="checkbox" id="chk2" class="check-box">
          <label for="chk2">
            <span class="check-num">02</span>
            <span class="check-cat">予約</span>
            <span class="check-text">予約は希望時間の1時間前までで、WEB・電話・LINEのどれで予約するかを決めた</span>
          </label>
        </div>
        <div class="check-item">
          <input type="checkbox" id="chk3" class="check-box">
          <label for="chk3">
            <span class="check-num">03</span>
            <span class="check-cat">診察料</span>
            <span class="check-text">診察料は無料で、診察終了後に自己判断でキャンセルすると3,000円かかることを確かめた</span>
          </label>
        </div>
        <div class="check-item">
          <input type="checkbox" id="chk4" class="check-box">
          <label for="chk4">
            <span class="check-num">04</span>
            <span class="check-cat">薬の価格</span>
            <span class="check-text">薬の価格は、一錠あたりの価格とまとめて頼んだときの価格、税込の表示かどうかを公式の料金表で確かめることにした</span>
          </label>
        </div>
        <div class="check-item">
          <input type="checkbox" id="chk5" class="check-box">
          <label for="chk5">
            <span class="check-num">05</span>
            <span class="check-cat">送料</span>
            <span class="check-text">送料は385円で、1万円以上の処方で送料無料になることを確かめた</span>
          </label>
        </div>
        <div class="check-item">
          <input type="checkbox" id="chk6" class="check-box">
          <label for="chk6">
            <span class="check-num">06</span>
            <span class="check-cat">処方の単位</span>
            <span class="check-text">初診は1錠から、再診は2錠から頼めることを確かめた</span>
          </label>
        </div>
        <div class="check-item">
          <input type="checkbox" id="chk7" class="check-box">
          <label for="chk7">
            <span class="check-num">07</span>
            <span class="check-cat">未承認の医薬品</span>
            <span class="check-text">海外製のジェネリックは国内未承認で、医薬品副作用被害救済制度の対象外であることを確かめた</span>
          </label>
        </div>
        <div class="check-item">
          <input type="checkbox" id="chk8" class="check-box">
          <label for="chk8">
            <span class="check-num">08</span>
            <span class="check-cat">副作用</span>
            <span class="check-text">公式に表示されている主な副作用（頭痛、ほてり・顔の赤み、鼻づまり、動悸、めまい、消化不良など）を読んだ</span>
          </label>
        </div>
        <div class="check-item">
          <input type="checkbox" id="chk9" class="check-box">
          <label for="chk9">
            <span class="check-num">09</span>
            <span class="check-cat">支払い方法</span>
            <span class="check-text">クレジットカード・銀行振込・代金引換・コンビニ払いのどれで払うかを決めた</span>
          </label>
        </div>
        <div class="check-item">
          <input type="checkbox" id="chk10" class="check-box">
          <label for="chk10">
            <span class="check-num">10</span>
            <span class="check-cat">カードの種類</span>
            <span class="check-text">オンラインのクレジットカード払いは VISA・Master のみ・1回払いであることを確かめた</span>
          </label>
        </div>
        <div class="check-item">
          <input type="checkbox" id="chk11" class="check-box">
          <label for="chk11">
            <span class="check-num">11</span>
            <span class="check-cat">届く日</span>
            <span class="check-text">15時までの入金で即日発送、届く目安は最短翌日〜2日であることを確かめた</span>
          </label>
        </div>
        <div class="check-item">
          <input type="checkbox" id="chk12" class="check-box">
          <label for="chk12">
            <span class="check-num">12</span>
            <span class="check-cat">受け取り</span>
            <span class="check-text">発送元は院長の個人名で、中身が分からない梱包で届くことを確かめた</span>
          </label>
        </div>
        <div class="check-item">
          <input type="checkbox" id="chk13" class="check-box">
          <label for="chk13">
            <span class="check-num">13</span>
            <span class="check-cat">返品</span>
            <span class="check-text">商品の性質上、返品・交換は受け付けていないことを確かめた</span>
          </label>
        </div>
        <div class="check-item">
          <input type="checkbox" id="chk14" class="check-box">
          <label for="chk14">
            <span class="check-num">14</span>
            <span class="check-cat">年齢</span>
            <span class="check-text">未成年（17歳以下）は治療を受けられないことを確かめた</span>
          </label>
        </div>
        <div class="check-item">
          <input type="checkbox" id="chk15" class="check-box">
          <label for="chk15">
            <span class="check-num">15</span>
            <span class="check-cat">医師に伝えること</span>
            <span class="check-text">持病や、いま飲んでいる薬を問診で伝えられるようにした</span>
          </label>
        </div>
        <div class="check-item">
          <input type="checkbox" id="chk16" class="check-box">
          <label for="chk16">
            <span class="check-num">16</span>
            <span class="check-cat">医師に聞くこと</span>
            <span class="check-text">服用できるかどうか、どの薬が合うかを問診で医師に聞くことにした</span>
          </label>
        </div>

<button class="print-btn" onclick="window.print()">🖨️ 印刷 / PDFで保存</button>

<div class="footer">
  このチェックリストは フィットクリニック の申込み前確認用です。
  情報は 2026年10月24日 時点のものです。最新情報は公式サイトでご確認ください。
</div>
</body>
</html>
