<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>チャイルド・アイズ チャイルド・アイズ 問い合わせ・面談チェックリスト</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Noto Sans JP', 'Hiragino Sans', 'Meiryo', sans-serif;
  font-size: 14px;
  line-height: 1.7;
  color: #1f2937;
  background: #f9fafb;
  padding: 20px;
  max-width: 720px;
  margin: 0 auto;
}
.header {
  background: linear-gradient(135deg, #1d4ed8, #3b82f6);
  color: #fff;
  padding: 20px 24px;
  border-radius: 10px;
  margin-bottom: 20px;
}
.header h1 { font-size: 1.25rem; font-weight: bold; margin-bottom: 4px; }
.header .meta { font-size: .8rem; opacity: .85; }
.section-title {
  font-size: .8rem;
  font-weight: bold;
  color: #6b7280;
  text-transform: uppercase;
  letter-spacing: .05em;
  margin: 20px 0 8px;
  padding-bottom: 4px;
  border-bottom: 1px solid #e5e7eb;
}
.check-item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 10px 12px;
  background: #fff;
  border: 1px solid #e5e7eb;
  border-radius: 6px;
  margin-bottom: 6px;
  cursor: pointer;
  transition: background .15s;
}
.scope-note {
  background: #fffbeb;
  border: 1px solid #f59e0b;
  border-radius: 6px;
  padding: 10px 12px;
  margin-bottom: 12px;
  font-size: .85rem;
}
.check-item:hover { background: #f0f9ff; }
.check-box { width: 18px; height: 18px; cursor: pointer; flex-shrink: 0; margin-top: 2px; accent-color: #3b82f6; }
label { display: flex; flex-wrap: wrap; gap: 4px 8px; cursor: pointer; flex: 1; }
.check-num {
  background: #dbeafe;
  color: #1d4ed8;
  font-size: .75rem;
  font-weight: bold;
  border-radius: 3px;
  padding: 0 5px;
  white-space: nowrap;
}
.check-cat {
  font-size: .8rem;
  color: #6b7280;
  white-space: nowrap;
}
.check-text { font-size: .88rem; color: #1f2937; }
input:checked + label .check-text { text-decoration: line-through; color: #9ca3af; }
.footer {
  text-align: center;
  font-size: .75rem;
  color: #9ca3af;
  margin-top: 20px;
  padding-top: 12px;
  border-top: 1px solid #e5e7eb;
}
.print-btn {
  display: block;
  width: 100%;
  padding: 10px;
  background: #3b82f6;
  color: #fff;
  border: none;
  border-radius: 6px;
  font-size: .9rem;
  cursor: pointer;
  margin-top: 16px;
}
.print-btn:hover { background: #2563eb; }

@media print {
  body { background: #fff; padding: 0; max-width: 100%; }
  .header { background: #1d4ed8 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .check-box { -webkit-print-color-adjust: exact; }
  .print-btn { display: none; }
  .check-item { break-inside: avoid; }
}
</style>
</head>
<body>
<div class="header">
  <h1>📋 チャイルド・アイズ</h1>
  <div class="meta">チャイルド・アイズ 問い合わせ・面談チェックリスト｜2026年11月02日 作成</div>
</div>

<div class="section-title">確認事項（全21項目）</div>

        <div class="check-item">
          <input type="checkbox" id="chk1" class="check-box">
          <label for="chk1">
            <span class="check-num">01</span>
            <span class="check-cat">対象年齢とコース</span>
            <span class="check-text">子どもの年齢が対象（1.5歳〜小学6年生）に入るかと、知能育成コースと受験対策コースのどちらにするかを確かめた</span>
          </label>
        </div>
        <div class="check-item">
          <input type="checkbox" id="chk2" class="check-box">
          <label for="chk2">
            <span class="check-num">02</span>
            <span class="check-cat">教室の場所</span>
            <span class="check-text">通える範囲に教室があるかを、公式サイトの教室検索で確かめた</span>
          </label>
        </div>
        <div class="check-item">
          <input type="checkbox" id="chk3" class="check-box">
          <label for="chk3">
            <span class="check-num">03</span>
            <span class="check-cat">教室ごとの違い</span>
            <span class="check-text">通いたい教室で開講しているコースと、レッスンの曜日・時間を確かめ、通える教室が複数あれば体験で比べた</span>
          </label>
        </div>
        <div class="check-item">
          <input type="checkbox" id="chk4" class="check-box">
          <label for="chk4">
            <span class="check-num">04</span>
            <span class="check-cat">講師と指導方針</span>
            <span class="check-text">通いたい教室の指導方針や授業内容の疑問を、無料体験か教室見学で聞いた</span>
          </label>
        </div>
        <div class="check-item">
          <input type="checkbox" id="chk5" class="check-box">
          <label for="chk5">
            <span class="check-num">05</span>
            <span class="check-cat">レッスン料と教材の費用</span>
            <span class="check-text">毎月のレッスン料と教材の費用を公式サイトの料金表（Aエリア・Bエリア）で確かめ、通いたい教室がどちらの料金かを、教室への問い合わせか無料体験で確かめた</span>
          </label>
        </div>
        <div class="check-item">
          <input type="checkbox" id="chk6" class="check-box">
          <label for="chk6">
            <span class="check-num">06</span>
            <span class="check-cat">入会金とキャンペーン</span>
            <span class="check-text">入会金が通常23,100円（税込）で、2026年11月30日までの秋のキャンペーンでは11,550円（税込）になることと、通う教室で当てはまるかを教室に確かめた</span>
          </label>
        </div>
        <div class="check-item">
          <input type="checkbox" id="chk7" class="check-box">
          <label for="chk7">
            <span class="check-num">07</span>
            <span class="check-cat">ほかの費用</span>
            <span class="check-text">維持管理費（月1,628円）のほか、検定の受験料や季節講習の費用など、毎月のレッスン料のほかにかかる費用があるかを教室に確かめた</span>
          </label>
        </div>
        <div class="check-item">
          <input type="checkbox" id="chk8" class="check-box">
          <label for="chk8">
            <span class="check-num">08</span>
            <span class="check-cat">支払い方法</span>
            <span class="check-text">毎月のレッスン料の支払い方法（振込・口座振替など）を、通いたい教室に確かめた</span>
          </label>
        </div>
        <div class="check-item">
          <input type="checkbox" id="chk9" class="check-box">
          <label for="chk9">
            <span class="check-num">09</span>
            <span class="check-cat">教材</span>
            <span class="check-text">知研式知能理論に基づくオリジナル教材（100種類以上）を使うことを確かめた</span>
          </label>
        </div>
        <div class="check-item">
          <input type="checkbox" id="chk10" class="check-box">
          <label for="chk10">
            <span class="check-num">10</span>
            <span class="check-cat">レッスンの形</span>
            <span class="check-text">レッスンは母子分離型が基本で、1.5〜3歳などは保護者の同伴もできることを確かめ、レッスンに同席したいかを考えた</span>
          </label>
        </div>
        <div class="check-item">
          <input type="checkbox" id="chk11" class="check-box">
          <label for="chk11">
            <span class="check-num">11</span>
            <span class="check-cat">受験対策コースの開講</span>
            <span class="check-text">受験対策コースを考えているなら、通いたい教室でそのコースを開講しているかを、体験の申し込みのときに確かめた</span>
          </label>
        </div>
        <div class="check-item">
          <input type="checkbox" id="chk12" class="check-box">
          <label for="chk12">
            <span class="check-num">12</span>
            <span class="check-cat">受験対策の中身</span>
            <span class="check-text">小学校受験の対策ではペーパーテストのほかに行動観察・面接対策もあることを確かめ、志望校に合わせた対策の中身を教室に聞いた</span>
          </label>
        </div>
        <div class="check-item">
          <input type="checkbox" id="chk13" class="check-box">
          <label for="chk13">
            <span class="check-num">13</span>
            <span class="check-cat">合格実績</span>
            <span class="check-text">志望する幼稚園・小学校への合格実績があるかと、教室の得意な受験校を教室に聞いた</span>
          </label>
        </div>
        <div class="check-item">
          <input type="checkbox" id="chk14" class="check-box">
          <label for="chk14">
            <span class="check-num">14</span>
            <span class="check-cat">中学受験準備</span>
            <span class="check-text">中学受験準備コースの目的を確かめ、志望校別の受験指導が要るなら進学塾との併用を考えた</span>
          </label>
        </div>
        <div class="check-item">
          <input type="checkbox" id="chk15" class="check-box">
          <label for="chk15">
            <span class="check-num">15</span>
            <span class="check-cat">家庭学習</span>
            <span class="check-text">教室のレッスンのほかに、家での取り組みが求められるかを確かめた</span>
          </label>
        </div>
        <div class="check-item">
          <input type="checkbox" id="chk16" class="check-box">
          <label for="chk16">
            <span class="check-num">16</span>
            <span class="check-cat">無料体験の申し込み</span>
            <span class="check-text">無料体験レッスン・教室見学を、公式サイトのWebフォームから申し込めることを確かめた</span>
          </label>
        </div>
        <div class="check-item">
          <input type="checkbox" id="chk17" class="check-box">
          <label for="chk17">
            <span class="check-num">17</span>
            <span class="check-cat">無料体験で見ること</span>
            <span class="check-text">無料体験で、子どもの反応・講師との相性・教室の雰囲気・ほかの生徒の様子を見て、入会するかを決めることにした</span>
          </label>
        </div>
        <div class="check-item">
          <input type="checkbox" id="chk18" class="check-box">
          <label for="chk18">
            <span class="check-num">18</span>
            <span class="check-cat">転居のとき</span>
            <span class="check-text">転居の予定があるなら、転居先の近くの教室へ移れるかと、その手続きを教室に聞いた</span>
          </label>
        </div>
        <div class="check-item">
          <input type="checkbox" id="chk19" class="check-box">
          <label for="chk19">
            <span class="check-num">19</span>
            <span class="check-cat">ほかの教室との比較</span>
            <span class="check-text">ほかの幼児教室（七田式・こぐま会など）と、対象年齢・目的・通える場所・料金の出し方を比べた</span>
          </label>
        </div>
        <div class="check-item">
          <input type="checkbox" id="chk20" class="check-box">
          <label for="chk20">
            <span class="check-num">20</span>
            <span class="check-cat">最新の情報</span>
            <span class="check-text">対象条件・料金・キャンペーン内容は変わることがあるため、申し込む前に公式サイトで最新の情報を確かめた</span>
          </label>
        </div>
        <div class="check-item">
          <input type="checkbox" id="chk21" class="check-box">
          <label for="chk21">
            <span class="check-num">21</span>
            <span class="check-cat">問い合わせ</span>
            <span class="check-text">気になる点を、申し込む前に公式サイトの問い合わせ窓口か通いたい教室に問い合わせた</span>
          </label>
        </div>

<button class="print-btn" onclick="window.print()">🖨️ 印刷 / PDFで保存</button>

<div class="footer">

</div>
</body>
</html>
